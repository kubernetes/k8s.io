grafana:
  defaultDashboardsEnabled: false
  admin:
    existingSecret: grafana-credentials
    userKey: username
    passwordKey: password
  enabled: true
  service:
    type: NodePort
  sidecar:
    dashboards:
      enabled: true
  persistence:
    enabled: true
    storageClassName: hyperdisk-balanced
    size: 30Gi
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: true
    server:
      root_url: https://monitoring-gke.prow.k8s.io
    auth.anonymous:
      enabled: true
      org_role: Viewer

kube-state-metrics:
  metricLabelsAllowlist:
   - pods=[*]
   - deployments=[app.kubernetes.io/name,app.kubernetes.io/component,app.kubernetes.io/instance]

nodeExporter:
  enabled: false

defaultRules:
  create: false

alertmanager:
  enabled: false

prometheus:
  agentMode: true
  prometheusSpec:
    resources:
      requests:
        cpu: 1
        memory: 8Gi
      limits:
        memory: 16Gi
    storageSpec:
      emptyDir:
        sizeLimit: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    externalLabels:
      cluster: gke-prow-build
      cloud: gcp
    remoteWrite:
      - url: https://mimir.prow.k8s.io/api/v1/push
        basicAuth:
          username:
            name: mimir-credentials
            key: username
          password:
            name: mimir-credentials
            key: password
        headers:
          X-Scope-OrgID: prow
# These endpoints aren't scrapable on GKE
coreDns:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
