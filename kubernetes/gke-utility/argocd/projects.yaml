---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ibm
spec:
  description: Applications on IBM clusters
  roles:
    - name: admin
      description: Full access to IBM project resources
      groups:
        - kubernetes:k8s-infra-ibm-admins
      policies:
        - p, proj:ibm:admin, applications, *, ibm/*, allow
        - p, proj:ibm:admin, applicationsets, *, ibm/*, allow
        - p, proj:ibm:admin, repositories, *, ibm/*, allow
        - p, proj:ibm:admin, clusters, *, ibm/*, allow
        - p, proj:ibm:admin, logs, *, ibm/*, allow
        - p, proj:ibm:admin, exec, *, ibm/*, allow
  sourceRepos:
    - '*'
  destinations:
    - name: ibm-*
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

