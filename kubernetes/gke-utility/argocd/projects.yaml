apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aks
spec:
  description: Applications on AKS clusters
  sourceRepos:
    - '*'
  destinations:
    - name: aks-*
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
