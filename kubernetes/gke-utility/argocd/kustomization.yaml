apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - github.com/argoproj/argo-cd/manifests/ha/cluster-install?ref=v3.5.1
  - extras.yaml
  - clusters.yaml

# pin dex to a newer patch version till argocd picks up the new image
# https://github.com/openshift-online/gcp-hcp/pull/64
images:
  - name: ghcr.io/dexidp/dex
    newTag: v2.45.1

patches:
  - path: argocd-cmd-params-cm.yaml
  - path: argocd-cm.yaml
  - path: argocd-cm-rbac.yaml
  - path: argocd-sa.yaml
  - patch: |- # https://github.com/argoproj/argo-cd/issues/11086
      - op: add
        path: /spec/egress/1/ports/-
        value:
          port: 15012
          protocol: TCP
    target:
      kind: NetworkPolicy
      name: argocd-redis-ha-server-network-policy
  - path: argocd-server-dp.yaml
  - path: argocd-app-controller-sts.yaml
