apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - secrets.yaml
  - httproute.yaml
  - dashboards.yaml
  - hyperdisk-sc.yaml
  - fastly/secrets.yaml
  - fastly/prometheus-agent.yaml

helmCharts:
  - name: prometheus-fastly-exporter
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: fastly-exporter
    version: 0.14.1
    valuesFile: fastly/exporter-values.yaml

secretGenerator:
  - name: fastly-scrape-config
    options:
      disableNameSuffixHash: true
    files:
      - fastly/scrape-config.yaml

configMapGenerator:
  - name: prow-dashboards
    behavior: merge
    files:
      - dashboards/builds.json
      - dashboards/jobs.json
      - dashboards/organizations.json
      - dashboards/repositories.json
  - name: prow-dashboards-gcp
    behavior: merge
    files:
      - dashboards-gcp/builds.json
      - dashboards-gcp/jobs.json
      - dashboards-gcp/organizations.json
      - dashboards-gcp/repositories.json
  - name: prow-dashboards-aws
    behavior: merge
    files:
      - dashboards-aws/builds.json
      - dashboards-aws/jobs.json
      - dashboards-aws/organizations.json
      - dashboards-aws/repositories.json

  - name: fastly-dashboards
    behavior: merge
    files:
      - dashboards-fastly/home.json
      - dashboards-fastly/fastly-dashboard.json
      - dashboards-fastly/fastly-service.json
      - dashboards-fastly/fastly-top-services.json
      - dashboards-fastly/fastly-top-pops.json
      - dashboards-fastly/fastly-top-origins.json
      - dashboards-fastly/fastly-top-domains.json
      - dashboards-fastly/fastly-thresholds.json
      - dashboards-fastly/fastly-security.json
      - dashboards-fastly/fastly-compute.json
