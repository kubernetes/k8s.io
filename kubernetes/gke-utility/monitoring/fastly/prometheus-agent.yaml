apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-agent-fastly
automountServiceAccountToken: false
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: PrometheusAgent
metadata:
  name: fastly
spec:
  replicas: 1
  serviceAccountName: prometheus-agent-fastly
  automountServiceAccountToken: false
  scrapeInterval: 15s

  externalLabels:
    cluster: gke-utility
    source: fastly
  replicaExternalLabelName: ""
  prometheusExternalLabelName: ""

  additionalScrapeConfigs:
    name: fastly-scrape-config
    key: scrape-config.yaml

  remoteWrite:
    - url: http://mimir-gateway.mimir.svc.cluster.local/api/v1/push
      basicAuth:
        username:
          name: mimir-credentials
          key: username
        password:
          name: mimir-credentials
          key: password
      headers:
        X-Scope-OrgID: fastly
      queueConfig:
        maxSamplesPerSend: 5000
        maxShards: 20

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
