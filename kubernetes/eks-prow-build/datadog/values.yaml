registry: public.ecr.aws/datadog
datadog:
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  site: us5.datadoghq.com
  confd:
    kubelet.yaml: |-
      init_config:
      instances:
        - min_collection_interval: 5
  clusterName: eks-prow-build-cluster
  logs:
    enabled: true
    containerCollectAll: true
    autoMultiLineDetection: true
  prometheusScrape:
    enabled: true
    serviceEndpoints: true
  kubeStateMetricsCore:
    enabled: true
  networkMonitoring:
    enabled: true
  processAgent:
    enabled: true
    processCollection: true
  sbom:
    enabled: true
    containerImage:
      enabled: true
      uncompressedLayersSupport: true
    host:
      enabled: true
  apm:
    instrumentation:
      skipKPITelemetry: true # https://github.com/DataDog/helm-charts/issues/1395
  operator:
    enabled: false
  kubernetesResourcesLabelsAsTags:
    nodes:
      kubernetes.io/arch: kubernetes.io/arch
    pods:
      prow.k8s.io/refs.org: prow.k8s.io/refs.org
      prow.k8s.io/refs.repo: prow.k8s.io/refs.repo
      prow.k8s.io/type: prow.k8s.io/type
      prow.k8s.io/job: prow.k8s.io/job
      prow.k8s.io/id: prow.k8s.io/id
clusterAgent:
  tokenExistingSecret: datadog-secret
agents:
  tolerations:
    - operator: Exists
