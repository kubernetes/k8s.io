groups:
  #
  # Mailing lists
  #
  # Each group here represents a mailing list for the WG or its subprojects,
  # and is not intended to govern access to infrastructure
  #
  - email-id: wg-node-identity-leads@kubernetes.io
    name: wg-node-identity-leads
    description: |-
      WG Node Identity Organizers
    settings:
      AllowWebPosting: "true"
      ReconcileMembers: "true"
      WhoCanPostMessage: "ANYONE_CAN_POST"
      WhoCanViewGroup: "ALL_MEMBERS_CAN_VIEW"
      WhoCanModerateContent: "OWNERS_AND_MANAGERS"
      MessageModerationLevel: "MODERATE_NONE"
    owners:
      - contributors@kubernetes.io
      - taahm@google.com
      - msm@opbstudios.com
      - chacman@microsoft.com
      - hi@josie.lol
      - naadir@randomvariable.co.uk
      - rodrigo@sdfg.com.ar

  - email-id: wg-node-identity@kubernetes.io
    name: wg-node-identity
    description: |-
      Public mailing list for WG Node Identity
    settings:
      WhoCanJoin: "ANYONE_CAN_JOIN"
      WhoCanViewGroup: "ANYONE_CAN_VIEW"
      WhoCanDiscoverGroup: "ANYONE_CAN_DISCOVER"
      WhoCanPostMessage: "ANYONE_CAN_POST"
      MessageModerationLevel: "MODERATE_NON_MEMBERS"
      WhoCanViewMembership: "ALL_MANAGERS_CAN_VIEW"
      WhoCanModerateMembers: "OWNERS_AND_MANAGERS"
      WhoCanModerateContent: "OWNERS_AND_MANAGERS"
      MembersCanPostAsTheGroup: "false"
      ReconcileMembers: "false"
    owners:
      - contributors@kubernetes.io
      - taahm@google.com
      - msm@opbstudios.com
      - chacman@microsoft.com
      - hi@josie.lol
      - naadir@randomvariable.co.uk
      - rodrigo@sdfg.com.ar
    members:
      - wg-node-identity-leads@kubernetes.io
